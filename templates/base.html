<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewSite | {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="{{ url_for('home') }}">BrewSite</a>
        <nav>
            <a href="{{ url_for('home') }}"
               class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
            <a href="{{ url_for('brewery') }}"
               class="{{ 'active' if request.endpoint == 'brewery' }}">Breweries</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>BrewSite &middot; ICT 362 Software Technology II &middot; Abraham Ortega</p>
    </footer>
</body>
</html>
